  environment: The environment in Q版 2D 卡通插畫 style is characterized by simplified,
    clean lines and a vibrant, high-contrast color palette. Geopolitical divisions,
    such as the 'Iron Curtain,' are visually represented by stylized, perhaps slightly
    wavy or jagged lines across a world map, or by distinct color palettes for different
    regions. Buildings and cityscapes are rendered in a blocky, almost toy-like fashion,
    with exaggerated architectural features. Soviet architecture, like in Moscow,
    is often depicted as imposing, symmetrical, and monochromatic (greys, dull browns),
    while Western architecture, such as in American cities, is more varied, colorful,
    and perhaps slightly more whimsical. Interiors, like the 'Kitchen Debate' setting,
    are clean, brightly lit, and feature exaggerated, simplified appliances and furniture.
    The lighting is flat, even, and bright, typical of 2D cartoon illustration, with
    no complex volumetric shadows or realistic light sources. Highlights are often
    stylized, clean white shapes, and shadows, if present, are simple, flat blocks
    of slightly darker color, adding depth without realism. The atmosphere is generally
    clear and crisp, with a sense of artificial brightness. When tension is high,
    the background might shift to slightly darker, more dramatic hues, but still within
    the cartoon aesthetic. Pepsi's iconic red, white, and blue colors are prominent
    and often act as a visual 'pop' against more subdued backgrounds.
