id: 20260929_百事可樂的蘇聯海軍
title: 百事可樂的蘇聯海軍
language: zh-Hant
voice_id: female01
visual_anchors:
  subject: "Donald Kendall: (masterpiece, best quality:1.2), 2D cartoon illustration,\
    \ anime art style, \nchibi characters, clean line art, cell shading, flat colors,\
    \ \nvisual novel style, crisp details, vibrant and cheerful color palette, \n\
    single coherent scene, non-split screen, unified single viewpoint, \nwide-angle\
    \ coherent view, one main environment, \nhighly detailed and intricate background,\
    \ \npacked with objects and props, \ndynamic composition within a single panel\n\
    \n Donald Kendall has a slightly exaggerated, confident smirk on his face, with\
    \ small, sharp eyes that twinkle with ambition. His neatly combed, slightly receding\
    \ hairline is rendered with smooth, blocky hair shapes. He has a small, pointed\
    \ nose and a thin, determined mouth. His body is a slightly portly but energetic\
    \ build, with typical Q-version proportions featuring a larger head and shorter,\
    \ sturdier limbs. He stands with a confident, slightly leaning posture. He wears\
    \ a crisp, simplified business suit in a classic 1950s/70s cut, in a dark blue\
    \ or charcoal grey, with a bright white shirt and a solid red or blue tie. The\
    \ tie knot is perfectly triangular, and the clothing features clean, bold colors\
    \ without intricate patterns. His skin tone is a warm, light peach. | Richard\
    \ Nixon: In Q版 2D 卡通插畫 style, Richard Nixon features a recognizable, slightly\
    \ jowly face, softened and made cute. His signature five o'clock shadow is represented\
    \ by a very light, subtle grey shading or a few stylized dots. He has small, beady\
    \ eyes that convey seriousness or a hint of exasperation, and a slightly downturned\
    \ mouth, often in a stern or debating expression. His dark hair is neatly combed\
    \ but simplified into a smooth, rounded shape. He has a sturdy, somewhat stiff\
    \ posture, with Q-version proportions that make him appear a bit stocky but not\
    \ overweight. He wears a dark, formal suit (black or dark navy) with a white shirt\
    \ and a conservative tie (perhaps striped or solid blue/red). The fabric appears\
    \ smooth and uncreased, rendered in flat, bold colors. | Nikita Khrushchev: In\
    \ Q版 2D 卡通插畫 style, Nikita Khrushchev has a round, jovial face, often depicted\
    \ with stylized sweat beads or a slightly flushed cheek color when excited. His\
    \ bald head is smooth and shiny, with a fringe of light grey hair around the sides.\
    \ He has small, expressive eyes that can shift from stern to surprisingly delighted,\
    \ and a wide, often smiling or laughing mouth, especially when drinking Pepsi.\
    \ His signature thick eyebrows are prominent. His body is very stout, almost spherical\
    \ in Q-version proportions, emphasizing his stocky build. His arms are often gesticulating\
    \ or holding something. He wears a simple, somewhat loose-fitting Soviet-era suit,\
    \ likely in a muted grey or brown, with a plain white shirt. The material looks\
    \ thick and practical, rendered in flat, solid colors. | Pepsi-Cola Bottle/Can:\
    \ In Q版 2D 卡通插畫 style, the Pepsi-Cola is depicted as a classic, iconic bottle\
    \ or can from the 1950s-1980s era. The bottle is a clear, stylized glass shape\
    \ with a vibrant blue and red label, while the can is a sleek, cylindrical form,\
    \ both featuring the iconic blue, red, and white Pepsi logo. The liquid inside\
    \ is a rich, dark brown, with stylized, effervescent bubbles rising to the top.\
    \ When poured into a glass, it forms a perfect, frothy head. The materials are\
    \ smooth, reflective glass or metal for the container, and the label is flat,\
    \ bright, and clean. It often has a stylized 'cool' or 'refreshing' aura, perhaps\
    \ with tiny ice cubes or condensation droplets rendered with clean white highlights.\
    \ | Soviet Submarine (Type 613): In Q版 2D 卡通插畫 style, the Soviet Submarine (Type\
    \ 613) is a simplified, chunky, and slightly cute rendition of the vessel. Its\
    \ long, cigar-shaped hull is smooth and dark grey, with a distinct, rounded conning\
    \ tower (sail) in the middle. The periscope and antennae are simplified, short,\
    \ and stubby. Small, stylized portholes might be visible. The overall impression\
    \ is powerful yet approachable, like a toy, rendered with smooth, matte dark grey\
    \ or black for the hull, and red accents on the propeller or bottom. The colors\
    \ are predominantly dark grey/black, with red highlights, all in flat, bold tones.\
    \ | Soviet Cruiser/Destroyer: In Q版 2D 卡通插畫 style, the Soviet Cruiser/Destroyer\
    \ is an angular and imposing, yet still Q-version, warship. It features a prominent,\
    \ blocky superstructure with simplified radar dishes and antennae. The hull is\
    \ a lighter grey than the submarine, with a distinct bow and stern. Stylized gun\
    \ turrets (perhaps two or three, simplified into rounded blocks) are visible on\
    \ deck. Small, stylized Soviet flags might be flying. The overall look is powerful\
    \ but not menacing, like a detailed model. The materials are smooth, matte light\
    \ grey for the hull and superstructure, with darker grey or black for gun barrels\
    \ and radar. The colors are light grey, dark grey, and red for the Soviet flag,\
    \ all in clean, flat hues. | Stolichnaya Vodka Bottle: In Q版 2D 卡通插畫 style, the\
    \ Stolichnaya Vodka Bottle is a classic, instantly recognizable clear, stylized\
    \ glass bottle with a distinctive red and gold label. The label features the iconic\
    \ Moscow hotel illustration, simplified into a clean, graphic emblem. The liquid\
    \ inside is crystal clear. The bottle might have a stylized, slightly frosted\
    \ look to suggest coldness, rendered with clean white highlights. The materials\
    \ are smooth, reflective glass, and the label is flat, vibrant, and clean, using\
    \ bright red, gold, and white colors."
  environment: The environment in Q版 2D 卡通插畫 style is characterized by simplified,
    clean lines and a vibrant, high-contrast color palette. Geopolitical divisions,
    such as the 'Iron Curtain,' are visually represented by stylized, perhaps slightly
    wavy or jagged lines across a world map, or by distinct color palettes for different
    regions. Buildings and cityscapes are rendered in a blocky, almost toy-like fashion,
    with exaggerated architectural features. Soviet architecture, like in Moscow,
    is often depicted as imposing, symmetrical, and monochromatic (greys, dull browns),
    while Western architecture, such as in American cities, is more varied, colorful,
    and perhaps slightly more whimsical. Interiors, like the 'Kitchen Debate' setting,
    are clean, brightly lit, and feature exaggerated, simplified appliances and furniture.
    The lighting is flat, even, and bright, typical of 2D cartoon illustration, with
    no complex volumetric shadows or realistic light sources. Highlights are often
    stylized, clean white shapes, and shadows, if present, are simple, flat blocks
    of slightly darker color, adding depth without realism. The atmosphere is generally
    clear and crisp, with a sense of artificial brightness. When tension is high,
    the background might shift to slightly darker, more dramatic hues, but still within
    the cartoon aesthetic. Pepsi's iconic red, white, and blue colors are prominent
    and often act as a visual 'pop' against more subdued backgrounds.
