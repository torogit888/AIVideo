narration: 百事可樂提供濃縮原漿，在蘇聯設廠生產. 而蘇聯方面，則用他們引以為傲的伏特加，來支付可樂的費用. 百事可樂，因此獲得了蘇聯伏特加在美國的獨家代理權.
