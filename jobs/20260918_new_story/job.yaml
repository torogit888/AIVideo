visual_anchors:
  subject: Macro cinematic focus on Red Imported Fire Ants (Solenopsis invicta), highlighting
    a distinct large-headed soldier ant with sharp amber-brown mandibles and glossy
    reddish-dark chitin alongside sleeker orange-tinted worker ants. Their slender
    segmented legs, fine tactile antennae, and polished exoskeletons catch dramatic
    rim lighting, revealing microscopic hairs and subtle iridescent glimmers of pheromone
    droplets on their sensory appendages.
  environment: A dual-world setting blending a mid-20th-century biology laboratory—featuring
    vintage brass microscopes, glass petri dishes, dark wooden desks under warm tungsten
    lamps, and glass plates—with an intricate subterranean macro cross-section of
    a subterranean ant empire. Rich dark ochre earth, damp soil textures, and curving
    dirt chambers are illuminated by dramatic chiaroscuro lighting, accented by glowing
    golden and cyan volumetric pheromone trails weaving through both the laboratory
    glass and the underground tunnels.
