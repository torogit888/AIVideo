title: 第 6 幕
narration: 肯德爾親手為赫魯雪夫，倒了一杯冰鎮的百事可樂. 赫魯雪夫接過可樂，先是聞了聞，然後一飲而盡. 他評價這飲料不難喝，有點像鞋蠟的味道. 這句話聽起來有些奇怪，卻成了百事可樂，打入蘇聯市場的敲門磚.
