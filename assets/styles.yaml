pixel_art:
  name: 像素藝術風格 (Pixel Art Style)
  prefix: 復古像素藝術風格 (Pixel Art Style)，精緻 16-bit 像素塊狀結構，復古調色盤，懷舊街機遊戲質感，16:9 橫式構圖
