  preview: assets/styles/previews/watanabe_shinichiro.jpg
  description: 風格化的寫實、電影感強烈、音樂與畫面的高度融合（如 Jazz, Hip-hop）、流暢的動作場面、成熟的氛圍營造。
yuasa_masaaki:
  name: 湯淺政明風格 (Masaaki Yuasa Style)
  prefix: 湯淺政明意識感動漫風格 (Masaaki Yuasa Style)，極度自由奔放線條與變形，鮮豔怪異色彩，突破常規透視與動態構圖，16:9 橫式構圖
  negative: 文字浮水印、呆板平淡、寫實照片感、低細節模糊
  preview: assets/styles/previews/yuasa_masaaki.jpg
