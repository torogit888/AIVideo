sadamoto_yoshiyuki:
  name: 貞本義行風格 (Yoshiyuki Sadamoto Style)
  prefix: 貞本義行新世紀動畫風格 (Yoshiyuki Sadamoto Style)，纖細時尚人物設計，乾淨精準線條，柔和色彩，90年代經典動畫賽璐珞質感，16:9
    橫式構圖
  negative: 文字浮水印、現代3D塑料感、暗沉雜訊、低細節模糊
  preview: assets/styles/previews/sadamoto_yoshiyuki.jpg
