murata_yusuke:
  name: 村田雄介風格 (Yusuke Murata Style)
  prefix: 村田雄介極致動作漫畫風格 (Yusuke Murata Style)，極致作畫功底，流暢動感分鏡，精準透視與肌肉動態，飽滿畫面張力，16:9 橫式構圖
  negative: 文字浮水印、軟弱無力、現代3D塑料感、低細節走形
  preview: assets/styles/previews/murata_yusuke.jpg
