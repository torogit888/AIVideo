sumi_e:
  name: 水墨/墨繪風格 (Sumi-e / Ink Wash Style)
  prefix: 傳統水墨寫意風格 (Sumi-e / Ink Wash Style)，東方水墨筆觸，濃淡乾濕墨色變化，意境留白，大氣磅礡，16:9 橫式構圖
  negative: 文字浮水印、現代數碼平滑、塑料感、雜亂色彩
