    橫式構圖
  negative: 文字浮水印、鮮豔卡通、溫暖治癒、現代塑料感
  preview: assets/styles/previews/nihei_tsutomu.jpg
  description: 宏大、冰冷的巨大建築結構、後末日的荒涼感、生物機械設計、極簡的人物表情、強烈的黑白對比、硬核科幻氛圍。
shirow_masamune:
  name: 士郎正宗風格 (Masamune Shirow Style)
