watanabe_shinichiro:
  name: 渡邊信一郎作品風格 (Shinichiro Watanabe Style)
  prefix: 渡邊信一郎電影感風格 (Shinichiro Watanabe Style)，風格化寫實，成熟電影氛圍，流暢鏡頭語言，爵士與復古感，16:9 橫式構圖
